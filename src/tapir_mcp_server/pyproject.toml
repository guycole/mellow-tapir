[project]
name = "tapir-mcp-server"
version = "0.1.0"
description = "MCP server for tapir classification over a read-only SQLite catalog"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp==2.2.0",
    "uvicorn==0.53.0",
]

[project.scripts]
tapir-mcp = "mcp_server.__main__:main"
tapir-mcp-build-db = "mcp_server.build_db:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["mcp_server"]
